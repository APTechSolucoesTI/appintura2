# Cabeçalhos de segurança, num arquivo à parte.
#
# O nginx NÃO herda `add_header` de um bloco pai quando o filho declara o seu:
# a diretiva substitui a lista inteira, não acrescenta. Como `location /assets/`
# e `location = /index.html` precisam do próprio Cache-Control, eles apagavam
# todos os headers de segurança do `server` — e por isso nenhum deles chegava ao
# navegador, apesar de estarem declarados.
#
# Repetir por `include` em cada location é a saída sem módulo extra, e evita a
# lista divergir entre os blocos com o tempo.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content-Security-Policy.
#
# O bundle é servido daqui e fala com UM destino: o Supabase. `connect-src`
# lista os dois esquemas porque o supabase-js usa REST e também abre WebSocket
# para realtime.
#
# `style-src` precisa de 'unsafe-inline': o Tailwind injeta estilo em runtime e
# uma política estrita quebraria a folha inteira. `script-src` NÃO tem — é onde
# a diretiva de fato protege, e o Vite gera só arquivos externos.
#
# `img-src` aceita blob: por causa da captura de foto e assinatura em canvas, e
# https do Supabase por causa das URLs assinadas do Storage.
#
# Ao apontar para outro Supabase, este é o lugar a ajustar — senão o app carrega
# e nenhuma requisição passa, com erro só no console.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://supabase.aptechinfo.com.br:75; font-src 'self' data:; connect-src 'self' https://supabase.aptechinfo.com.br:75 wss://supabase.aptechinfo.com.br:75; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
