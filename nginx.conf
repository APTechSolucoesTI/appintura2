# =============================================================================
# nginx do APPintura — servir um SPA com react-router.
# =============================================================================

server {
  # 3000, e não a 80 que seria o natural para nginx: é a porta que todos os
  # apps deste Dokploy expõem, e é o default que ele preenche ao criar um
  # domínio. Divergir daqui rende Bad Gateway toda vez que alguém criar um
  # domínio novo no piloto automático.
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # O Dokploy/Traefik fica na frente; o IP real do visitante chega por header.
  # Sem isto o log registra só o IP do proxy.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json
    image/svg+xml;

  # Usado pelo HEALTHCHECK do Dockerfile. `access_log off` porque um ping a
  # cada 30s polui o log sem informar nada.
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # O Vite versiona os arquivos de `assets/` por hash no nome: mudou o
  # conteúdo, muda o nome. Por isso podem ser cacheados de forma agressiva —
  # nunca haverá um `index-a1b2c3.js` com conteúdo diferente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O index.html é o OPOSTO: nome fixo, conteúdo que muda a cada deploy. Se for
  # cacheado, o navegador continua pedindo os assets do deploy anterior, que já
  # não existem — a tela fica em branco depois de publicar.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Fallback do SPA: as rotas do react-router (/app/producao, /app/financeiro…)
  # não existem como arquivo. Sem esta linha, dar F5 dentro do sistema devolve
  # 404 do nginx em vez de abrir a aplicação.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cabeçalhos de segurança básicos. Sem CSP aqui de propósito: montar uma que
  # cubra Supabase, fontes e imagens exige a URL final do ambiente — fica para
  # quando o domínio estiver definido.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
